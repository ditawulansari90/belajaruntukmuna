<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Pembelajaran Interaktif ABK</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app-container {
      background: #FFFFFF;
      width: 100%;
      max-width: 800px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      padding: 25px;
      border: 6px solid #FFD166;
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-title {
      text-align: center;
      color: #FF477E;
      font-size: 2.2rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px #FFD166;
    }

    .subtitle {
      text-align: center;
      color: #4EA8DE;
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    .student-info {
      background: #F0F7FF;
      padding: 20px;
      border-radius: 20px;
      border: 3px dashed #4EA8DE;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 1.1rem;
      color: #06D6A0;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px 18px;
      font-size: 1.1rem;
      border: 3px solid #70C1B3;
      border-radius: 15px;
      outline: none;
      background: #FFF;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      margin-top: 15px;
    }

    .subject-btn {
      background: #FFF;
      border: 4px solid;
      border-radius: 22px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 0 rgba(0,0,0,0.1);
    }

    .subject-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 0 rgba(0,0,0,0.1);
    }

    .subject-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }

    .subject-btn img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .subject-btn h3 {
      font-size: 1.2rem;
    }

    .mat { border-color: #FF595E; color: #FF595E; }
    .indo { border-color: #FFCA3A; color: #D4A300; }
    .ipas { border-color: #8AC926; color: #6A9E1B; }
    .ppkn { border-color: #1982C4; color: #1982C4; }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 3px solid #EEE;
    }

    .badge {
      background: #FFD166;
      color: #333;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn-audio {
      background: #06D6A0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #04A77D;
    }

    .btn-audio:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #04A77D;
    }

    .question-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 15px;
    }

    .question-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 20px;
      border: 4px solid #FFD166;
      object-fit: contain;
      margin: 0 auto;
      display: block;
      background: #FFF;
      padding: 10px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .option-btn {
      background: #F8F9FA;
      border: 3px solid #CED4DA;
      border-radius: 18px;
      padding: 15px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: #4EA8DE;
      background: #EBF5FF;
    }

    .result-box {
      text-align: center;
      padding: 20px 10px;
    }

    .score-display {
      font-size: 4rem;
      font-weight: bold;
      margin: 15px 0;
    }

    .score-high { color: #06D6A0; }
    .score-low { color: #FF595E; }

    .feedback-msg {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .actions-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-wa { background: #25D366; box-shadow: 0 4px 0 #1EBE5D; }
    .btn-sheet { background: #4EA8DE; box-shadow: 0 4px 0 #3A81AC; }
    .btn-csv { background: #FFCA3A; color: #333; box-shadow: 0 4px 0 #D4A300; }
    .btn-home { background: #FF595E; box-shadow: 0 4px 0 #D84347; }

    .btn-action:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .teacher-config {
      margin-top: 20px;
      font-size: 0.9rem;
      background: #FFF9E6;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #FFE082;
    }
  </style>
</head>
<body>

      <div class="subject-grid">

          <img src="https://img.icons8.com/color/96/000000/abc.png" alt="B. Indonesia">
          <h3>B. Indonesia</h3>
        </div>
        <div class="subject-btn ipas" onclick="startQuiz('ipas')">
          <img src="https://img.icons8.com/color/96/000000/leaf.png" alt="IPAS">
          <h3>IPAS</h3>
        </div>
        <div class="subject-btn ppkn" onclick="startQuiz('ppkn')">
          <img src="https://img.icons8.com/color/96/000000/indonesia.png" alt="PPKn">
          <h3>PPKn</h3>
        </div>
      </div>

      <div class="teacher-config">
        <p><strong>Pengaturan WhatsApp Guru:</strong></p>
        <div style="display: flex; gap: 8px; margin-top: 5px;">
          <input type="text" id="wa-number" placeholder="No WhatsApp Guru (cth: 628123456789)" value="628123456789" style="font-size:0.9rem; padding:6px;">
        </div>
      </div>
    </div>

    <!-- 2. SCREEN KUIS -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-header">
        <span class="badge" id="quiz-title">Matematika</span>
        <button class="btn-audio" onclick="readQuestionAudio()">
          🔊 Baca Soal
        </button>
        <span class="badge" id="question-number">Soal 1/10</span>
      </div>

      <div class="question-box">
        <p class="question-text" id="question-text">Berapa jumlah benda berikut?</p>
        <img id="question-img" class="question-img" src="" alt="Gambar Soal">
      </div>

      <div class="options-grid" id="options-container">
      </div>
    </div>

    <!-- 3. SCREEN HASIL & SKOR -->
    <div id="screen-result" class="screen">
      <div class="result-box">
        <h2>Hasil Belajar</h2>
        <div id="score-display" class="score-display">0</div>
        <p id="feedback-msg" class="feedback-msg">Kamu Hebat!</p>

        <div class="actions-box">
          <button class="btn-action btn-sheet" onclick="sendToGoogleSheet()">
            📊 Simpan Otomatis ke Google Sheet
          </button>
          <button class="btn-action btn-wa" onclick="sendToWhatsApp()">
            📲 Kirim Nilai ke WA Guru
          </button>
          <button class="btn-action btn-csv" onclick="downloadCSV()">
            📥 Unduh Bukti Nilai (CSV)
          </button>
          <button class="btn-action btn-home" onclick="goHome()">
            🏠 Kembali ke Menu Utama
          </button>
        </div>
      </div>
    </div>

  </div>
