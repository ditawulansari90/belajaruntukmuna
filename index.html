  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app-container {
      background: #FFFFFF;
      width: 100%;
      max-width: 800px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      padding: 25px;
      border: 6px solid #FFD166;
      position: relative;
      overflow: hidden;
    }

    /* Screen Views */
    .screen {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header & Branding */
    .header-title {
      text-align: center;
      color: #FF477E;
      font-size: 2.2rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px #FFD166;
    }

    .subtitle {
      text-align: center;
      color: #4EA8DE;
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    /* Input Section */
    .student-info {
      background: #F0F7FF;
      padding: 20px;
      border-radius: 20px;
      border: 3px dashed #4EA8DE;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 1.1rem;
      color: #06D6A0;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px 18px;
      font-size: 1.1rem;
      border: 3px solid #70C1B3;
      border-radius: 15px;
      outline: none;
      background: #FFF;
    }

    /* Menu Subject Grid */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      margin-top: 15px;
    }

    .subject-btn {
      background: #FFF;
      border: 4px solid;
      border-radius: 22px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 0 rgba(0,0,0,0.1);
    }

    .subject-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 0 rgba(0,0,0,0.1);
    }

    .subject-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }

    .subject-btn img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .subject-btn h3 {
      font-size: 1.2rem;
    }

    /* Subject Colors */
    .mat { border-color: #FF595E; color: #FF595E; }
    .indo { border-color: #FFCA3A; color: #D4A300; }
    .ipas { border-color: #8AC926; color: #6A9E1B; }
    .ppkn { border-color: #1982C4; color: #1982C4; }

    /* Quiz Screen Elements */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 3px solid #EEE;
    }

    .badge {
      background: #FFD166;
      color: #333;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn-audio {
      background: #06D6A0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #04A77D;
    }

    .btn-audio:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #04A77D;
    }

    .question-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 15px;
    }

    .question-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 20px;
      border: 4px solid #FFD166;
      object-fit: contain;
      margin: 0 auto;
      display: block;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .option-btn {
      background: #F8F9FA;
      border: 3px solid #CED4DA;
      border-radius: 18px;
      padding: 15px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: #4EA8DE;
      background: #EBF5FF;
    }

    /* Result Screen */
    .result-box {
      text-align: center;
      padding: 20px 10px;
    }

    .score-display {
      font-size: 4rem;
      font-weight: bold;
      margin: 15px 0;
    }

    .score-high { color: #06D6A0; }
    .score-low { color: #FF595E; }

    .feedback-msg {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .actions-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

    .btn-sheet { background: #4EA8DE; box-shadow: 0 4px 0 #3A81AC; }
    .btn-csv { background: #FFCA3A; color: #333; box-shadow: 0 4px 0 #D4A300; }

      font-size: 0.9rem;
      background: #FFF9E6;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #FFE082;

    };

    // Global App State
    let currentSubject = '';
    let currentQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let studentName = '';

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startQuiz(subject) {
      const select = document.getElementById('student-select');
      studentName = select.value;

      if (!studentName) {
        alert("Silakan pilih Nama Siswa terlebih dahulu ya! 😊");
        speakText("Silakan pilih Nama Siswa terlebih dahulu ya!");
        return;
      }

      currentSubject = subject;
      currentQuestions = bankSoal[subject];
      currentIdx = 0;
      score = 0;

      const titleMap = {
        matematika: 'Matematika 🔢',
        indonesia: 'B. Indonesia 🔤',
        ipas: 'IPAS 🌿',
        ppkn: 'PPKn 🇮🇩'
      };
      document.getElementById('quiz-title').innerText = titleMap[subject];

      showScreen('screen-quiz');
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentIdx];
      document.getElementById('question-number').innerText = `Soal ${currentIdx + 1}/10`;
      document.getElementById('question-text').innerText = q.q;
      document.getElementById('question-img').src = q.img;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.onclick = () => checkAnswer(idx);
        btn.innerHTML = `<span>${opt.text}</span>`;
        container.appendChild(btn);
      });

      setTimeout(() => readQuestionAudio(), 300);
    }

    function checkAnswer(selectedIdx) {
      const q = currentQuestions[currentIdx];
      if (selectedIdx === q.answer) {
        score += 10;
        speakText("Pintar!");
      } else {
        speakText("Coba lagi ya");
      }

      currentIdx++;
      if (currentIdx < currentQuestions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function readQuestionAudio() {
      const qText = document.getElementById('question-text').innerText;
      speakText(qText);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function showResult() {
      showScreen('screen-result');
      const scoreDisplay = document.getElementById('score-display');
      const feedbackMsg = document.getElementById('feedback-msg');

      scoreDisplay.innerText = score;

      if (score >= 70) {
        scoreDisplay.className = "score-display score-high";
        feedbackMsg.innerText = "🌟 Kamu Hebat! 🌟";
        speakText("Kamu Hebat! Selamat ya!");
        triggerConfetti();
      } else {
        scoreDisplay.className = "score-display score-low";
        feedbackMsg.innerText = "💪 Ayo Semangat, Belajar lagi ya! 😊";
        speakText("Ayo Semangat, Belajar lagi ya!");
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function goHome() {
      showScreen('screen-menu');
    }

    // --- FITUR INTEGRASI OTOMATIS SWAP GOOGLE SHEET ---
    function sendToGoogleSheet() {
      const mapelTitle = document.getElementById('quiz-title').innerText;

      const payload = {
        tanggal: new Date().toLocaleDateString('id-ID'),
        nama: studentName,
        mapel: mapelTitle,
        skor: score
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("✅ Nilai " + studentName + " berhasil dikirim langsung ke Google Sheet!");
      })
      .catch((err) => {
        alert("Terjadi kendala saat mengirim data. Pastikan koneksi internet terhubung.");
        console.error(err);
      });
    }

    function sendToWhatsApp() {
      const waNumber = document.getElementById('wa-number').value || '628123456789';
      const mapelName = document.getElementById('quiz-title').innerText;
      
      const message = `Halo Bapak/Ibu Guru,%0A%0ABerikut Laporan Hasil Belajar Siswa:%0A👤 *Nama:* ${encodeURIComponent(studentName)}%0A📚 *Mata Pelajaran:* ${encodeURIComponent(mapelName)}%0A💯 *Skor/Nilai:* ${score}/100%0A%0ATerima kasih!`;
      
      window.open(`https://wa.me/${waNumber}?text=${message}`, '_blank');
    }

    function downloadCSV() {
      const dateStr = new Date().toLocaleDateString('id-ID');
      const csvContent = "data:text/csv;charset=utf-8," 
        + "Tanggal,Nama Siswa,Mata Pelajaran,Skor\n"
        + `"${dateStr}","${studentName}","${currentSubject}",${score}`;

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Nilai_${studentName}_${currentSubject}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
